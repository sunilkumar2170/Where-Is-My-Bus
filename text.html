<!DOCTYPE html>
<html>
<head><title>GPS Test</title></head>
<body>
  <h2>GPS Socket Test</h2>
  <button onclick="sendLocation()">Send GPS</button>
  <div id="log"></div>

  <script src="https://cdn.socket.io/4.7.0/socket.io.min.js"></script>
  <script>
    const socket = io('http://localhost:5000');
    
    socket.on('connect', () => {
      document.getElementById('log').innerHTML += '<p>✅ Connected!</p>';
    });

    socket.on('locationUpdate', (data) => {
      document.getElementById('log').innerHTML += 
        `<p>📍 Bus ${data.busId} → ${data.lat}, ${data.lng} @ ${data.speed}km/h</p>`;
    });

    function sendLocation() {
      socket.emit('sendLocation', {
        busId: 'BUS001',
        lat: 26.9124,
        lng: 75.7873,
        speed: 45
      });
    }
  </script>
</body>
</html>
